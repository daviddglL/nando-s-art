; Límites de subida para hostings con PHP-FPM o CGI que leen este fichero (la mayoría de los compartidos).
; Las fotos de las obras pueden pesar hasta 15 MB cada una (App\Actions\GuardarImagen::MAX_KB)
; y en "Más imágenes" se suben varias a la vez. Si el servidor usa mod_php o Nginx, ver el README.
upload_max_filesize = 16M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
